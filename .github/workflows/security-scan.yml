# Security baseline (Semgrep SAST, Trivy SCA/config, Betterleaks secrets),
# per the team "Security Tooling & Local Environment Setup Guide".
# Actions and tools are pinned to exact versions so the workflow passes its
# own Semgrep supply-chain checks.
name: Security Baseline
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep==1.178.0
      # With the org's SEMGREP_APP_TOKEN, findings go to the Semgrep AppSec
      # Platform and its policies decide what blocks. Without it (for example
      # PRs from forks), fall back to the local auto config.
      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            semgrep ci
          else
            semgrep scan --config auto --severity ERROR --error .
          fi

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy filesystem vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  betterleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      BETTERLEAKS_VERSION: "1.8.1"
      BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "/tmp/$archive" "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$archive"
          echo "${BETTERLEAKS_SHA256}  /tmp/$archive" | sha256sum -c -
          tar -xzf "/tmp/$archive" -C /tmp
          sudo mv /tmp/betterleaks /usr/local/bin/

      - name: Run Betterleaks secret detection
        run: betterleaks detect --source . --verbose --redact
